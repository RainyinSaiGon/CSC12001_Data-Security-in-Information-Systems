name: Subsystem 2 CI/CD

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Subsystem2-MedicalDataManagement/**'
      - '.github/workflows/subsystem2-ci.yml'

jobs:
  build-and-test:
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: ['6.0.x', '7.0.x']

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: |
          cd Subsystem2-MedicalDataManagement/Source
          dotnet restore MedicalDataSystem.sln

      - name: Build
        run: |
          cd Subsystem2-MedicalDataManagement/Source
          dotnet build MedicalDataSystem.sln --configuration Release --no-restore

      - name: Run tests
        run: |
          cd Subsystem2-MedicalDataManagement/Source
          dotnet test MedicalDataSystem.sln --configuration Release --no-build --verbosity normal

  code-quality:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'cpp'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
